name: Signal Scout scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Capture public sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run `pnpm cli init`, replace the example URL in the generated root
      # configuration, and review that file before enabling this schedule.
      - name: Restore the previous baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .signal-scout/baselines
          key: signal-scout-baselines-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            signal-scout-baselines-

      - name: Scan with the checked-out CLI
        run: pnpm cli scan

      - name: Save the current baseline
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .signal-scout/baselines
          key: signal-scout-baselines-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload evidence reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-scout-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: .signal-scout/reports
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
